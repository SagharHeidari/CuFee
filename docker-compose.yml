services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cx_user
      POSTGRES_PASSWORD: cx_password
      POSTGRES_DB: cx_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cx_user -d cx_analytics"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://cx_user:cx_password@db:5432/cx_analytics
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8501:8501"

volumes:
  pgdata:
